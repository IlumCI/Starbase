name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App display name'
        required: false
        default: 'Zen Fortress'
      package:
        description: 'Package name (e.g. com.ilum.zenfortress)'
        required: false
        default: 'com.ilum.zenfortress'
      version:
        description: 'Version string'
        required: false
        default: '1.0.0'

env:
  APP_NAME: ${{ inputs.app_name || 'Zen Fortress' }}
  PACKAGE: ${{ inputs.package || 'com.ilum.zenfortress' }}
  VERSION: ${{ inputs.version || '1.0.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          # Install Android command line tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools

          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "JAVA_HOME=${{ steps.setup-java.outputs.java-home }}" >> $GITHUB_ENV

          # Accept licenses and install required SDK components
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK setup complete"

      - name: Create love file
        run: |
          cd src
          zip -r ../game.love .
          cd ..
          echo "Created game.love ($(du -h game.love | cut -f1))"

      - name: Download love-android-serviceman
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            wget -q "https://github.com/love2d-community/love-android-serviceman/releases/download/continuous/serviceman-x86_64-linux.zip" -O /tmp/serviceman.zip
          else
            wget -q "https://github.com/love2d-community/love-android-serviceman/releases/download/continuous/serviceman-aarch64-linux.zip" -O /tmp/serviceman.zip
          fi
          unzip -q /tmp/serviceman.zip -d /tmp/
          chmod +x /tmp/serviceman
          /tmp/serviceman --version || true

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export JAVA_HOME="${{ steps.setup-java.outputs.java-home }}"
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          mkdir -p output

          # Try with keystore env vars if provided, otherwise unsigned
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.jks
            /tmp/serviceman \
              --app-name "$APP_NAME" \
              --package "$PACKAGE" \
              --version "$VERSION" \
              --input game.love \
              --output-dir output/ \
              --keystore /tmp/keystore.jks \
              --keystore-release-alias "$KEY_ALIAS" \
              --keystore-release-key-pass "$KEY_PASS" \
              --keystore-release-pass "$KEYSTORE_PASS"
          else
            /tmp/serviceman \
              --app-name "$APP_NAME" \
              --package "$PACKAGE" \
              --version "$VERSION" \
              --input game.love \
              --output-dir output/
          fi

          echo "=== APK files ==="
          find output/ -name "*.apk" -exec ls -lh {} \;

      - name: Find built APK
        run: |
          APK=$(find output/ -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "APK=$APK" >> $GITHUB_ENV
            echo "APK found: $APK ($(du -h $APK | cut -f1))"
          else
            echo "No APK found in output/"
            find output/ -type f | head -20
            exit 1
          fi

      - name: Upload APK artifact
        if: env.APK != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.run_number }}
          path: ${{ env.APK }}
          retention-days: 14

      - name: Summary
        run: |
          if [ -n "${{ env.APK }}" ]; then
            echo "### Build Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "APK: \`${{ env.APK }}\`" >> $GITHUB_STEP_SUMMARY
            ls -lh "${{ env.APK }}"
          else
            echo "Build failed — check logs above" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi