name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App display name'
        required: false
        default: 'Zen Fortress'
      package:
        description: 'Package name (e.g. com.ilum.zenfortress)'
        required: false
        default: 'com.ilum.zenfortress'
      version:
        description: 'Version string'
        required: false
        default: '1.0.0'

env:
  APP_NAME: ${{ inputs.app_name || 'Zen Fortress' }}
  PACKAGE: ${{ inputs.package || 'com.ilum.zenfortress' }}
  VERSION: ${{ inputs.version || '1.0.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install components
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk

          SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            ls -la $ANDROID_HOME/cmdline-tools/ 2>/dev/null || echo "no cmdline-tools"
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses 2>/dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set environment variables
        run: |
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "JAVA_HOME=${{ steps.setup-java.outputs.java-home }}" >> $GITHUB_ENV

      - name: Create love file
        run: |
          cd src
          # Create .love archive from all Lua files
          zip -r ../game.love .
          cd ..
          echo "Created game.love ($(du -h game.love | cut -f1))"

      - name: Download love-android-serviceman
        run: |
          wget -q "https://github.com/love2d-community/love-android-serviceman/releases/download/continuous/serviceman-$(uname -m)-linux.zip" -O /tmp/serviceman.zip
          unzip -q /tmp/serviceman.zip -d /tmp/
          chmod +x /tmp/serviceman
          /tmp/serviceman --version || true

      - name: Build APK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export JAVA_HOME="${{ steps.setup-java.outputs.java-home }}"
          export PATH=$JAVA_HOME/bin:$PATH

          mkdir -p output

          /tmp/serviceman \
            --app-name "$APP_NAME" \
            --package "$PACKAGE" \
            --version "$VERSION" \
            --input game.love \
            --output-dir output/ \
            --keystore-release-alias "$KEY_ALIAS" \
            --keystore-release-key-pass "$KEY_PASS" \
            --keystore-release-pass "$KEYSTORE_PASS" || true

          # If serviceman fails (no keystore), try basic build
          if ! ls output/*.apk 2>/dev/null; then
            /tmp/serviceman \
              --app-name "$APP_NAME" \
              --package "$PACKAGE" \
              --version "$VERSION" \
              --input game.love \
              --output-dir output/
          fi

          echo "=== APK files ==="
          find output/ -name "*.apk" -exec ls -lh {} \;

      - name: Find built APK
        run: |
          APK=$(find output/ -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "APK=$APK" >> $GITHUB_ENV
            echo "APK found: $APK ($(du -h $APK | cut -f1))"
          else
            echo "No APK found in output/"
            find output/ -type f | head -20
          fi

      - name: Upload APK artifact
        if: env.APK != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.run_number }}
          path: ${{ env.APK }}
          retention-days: 14

      - name: Summary
        run: |
          if [ -n "${{ env.APK }}" ]; then
            echo "Build succeeded"
            ls -lh "${{ env.APK }}"
          else
            echo "Build failed — check logs above"
          fi