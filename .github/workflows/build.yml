name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App display name'
        required: false
        default: 'Zen Fortress'
      package:
        description: 'Package name'
        required: false
        default: 'com.ilum.zenfortress'
      version:
        description: 'Version string'
        required: false
        default: '1.0.0'

env:
  APP_NAME: ${{ inputs.app_name || 'Zen Fortress' }}
  PACKAGE: ${{ inputs.package || 'com.ilum.zenfortress' }}
  VERSION: ${{ inputs.version || '1.0.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        id: java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK via love-android gradle template
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.18-8/x64
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"

          # Ubuntu-latest already has Android SDK at this path
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          echo "Android SDK: $ANDROID_HOME"
          ls $ANDROID_HOME/

          # Accept SDK licenses
          yes 2>/dev/null | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

          # Package game.love (from repo root, absolute path)
          zip -r /tmp/game.love src/

          # Clone love-android template
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/love2d-community/love-android.git /tmp/love-android --depth 1
          git -C /tmp/love-android submodule update --init --recursive 2>/dev/null || true

          # Inject game.love into template assets
          cp /tmp/game.love /tmp/love-android/game/src/main/assets/game.love
          echo "game.love size: $(du -h /tmp/love-android/game/src/main/assets/game.love | cut -f1)"

          # Configure gradle.properties
          cd /tmp/love-android/game
          echo "APP_NAME=$APP_NAME" >> gradle.properties
          echo "PACKAGE_NAME=$PACKAGE" >> gradle.properties
          echo "VERSION_NAME=$VERSION" >> gradle.properties

          # Build release APK
          ./gradlew assembleRelease --no-daemon -q 2>&1 | tail -5

          # Find APK
          APK=$(find . -path "*/build/outputs/apk/*/release/*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -newer /tmp/love-android/game/build.gradle 2>/dev/null | head -1)
          fi

          if [ -n "$APK" ] && [ -f "$APK" ]; then
            echo "APK: $APK ($(du -h $APK | cut -f1))"
            mkdir -p $GITHUB_WORKSPACE/output
            cp "$APK" $GITHUB_WORKSPACE/output/
          else
            echo "APK not found, checking build outputs:"
            find . -name "*.apk" 2>/dev/null
            find . -path "*/build/outputs/*" 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.run_number }}
          path: output/*.apk
          retention-days: 14

      - name: Summary
        run: |
          if ls output/*.apk 1>/dev/null 2>&1; then
            echo "### Build Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for f in output/*.apk; do
              echo "- \`$(basename $f)\` ($(du -h "$f" | cut -f1))" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "Build failed — check logs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
